# Runs on every pull request and on main: formatting, the plugin validator and the tests.
# The typecheck needs the plugin API types a Claude Code session writes when it loads the mod. CI has
# no session, so it uses the committed copy in types-pinned/ (refresh: scripts/types.sh --pin).
name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No npm cache: it saves under a second here, and when GitHub refuses the download the step hangs for 10 minutes.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm run format:check
      - name: Typecheck against the pinned plugin API types
        run: scripts/types.sh --pinned && npm run typecheck
      - run: npm run validate
      - run: npm test
      - name: Herdr app mod tests
        run: npm run test:app
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python script tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
  # The status main's ruleset requires. A skipped required check counts as passed, so this always runs and looks at both.
  check:
    needs: [mod, python]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Both jobs passed
        run: test "${{ needs.mod.result }}" = success && test "${{ needs.python.result }}" = success
